<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">
		<ui:param name="header" value="Charts" />
	<ui:param name="headerRendered" value="true" />
	<ui:define name="content">
		<p:panelGrid columns="2" styleClass="ui-panelgrid-blank ui-fluid"
			columnClasses="ui-grid-col-2,ui-grid-col-10"
			style="width:100%; gap:14px;">

			<h:form id="expenseCategoriesForm"
				style="border:3px solid #ccc; padding:15px; border-radius:8px; margin-right:10px;height: 600px;">
				<h:outputText value="Categories"
					style="font-weight:bold;height: 23px;margin-bottom:10px; display:block;background-color: #00aab4;border-radius: 3px;" />
				
				<p:commandButton value="All"
					action="#{ManageExpenseChartActionBean.selectCategory('All','Allcategories')}"
					process="@this"
					update=":expenseChartForm:chartPanel :expenseChartForm:selectedCategoryLabel "
					style="margin-bottom:8px; width:90%;"
					styleClass="ui-panelgrid-blank ui-fluid" />
					
				<ui:repeat value="#{ManageExpenseChartActionBean.categoryList}"
					var="cat">
					<p:commandButton value="#{cat.name}"
						action="#{ManageExpenseChartActionBean.selectCategory(cat.id,cat.name)}"
						process="@this"
						update=":expenseChartForm:chartPanel :expenseChartForm:selectedCategoryLabel "
						style="margin-bottom:8px; width:90%;"
						styleClass="ui-panelgrid-blank ui-fluid" />
				</ui:repeat>
			</h:form>

			<!-- Chart Form -->
			<h:form id="expenseChartForm"
				style="border:1px solid #ccc; padding:10px; border-radius:8px;height: 600px;">
				<p:panelGrid columns="1"
					style="padding-left:10px; width:100%; justify-content:center;"
					styleClass="ui-panelgrid-blank">

					<p:panelGrid
						style="margin-bottom:20px; border:none; background:none;">
						<h:outputLabel value="View: " style="margin-bottom:5px;" />
						<p:selectOneMenu
							value="#{ManageExpenseChartActionBean.timeperiod}"
							style="margin-bottom:15px; width:200px;">
							<f:selectItem itemLabel="Select Time Period" itemValue=""
								noSelectionOption="true" />
							<f:selectItem itemLabel="Daily" itemValue="DAILY" />
							<f:selectItem itemLabel="Monthly" itemValue="MONTHLY" />
							<f:selectItem itemLabel="Yearly" itemValue="YEARLY" />
							<p:ajax listener="#{ManageExpenseChartActionBean.updateChart}"
								update=":expenseChartForm:chartPanel :expenseChartForm:datePickers" />
						</p:selectOneMenu>

						<p:outputPanel id="datePickers">

							<!-- pick month and year-->
							<p:outputLabel value="Range: " rendered="#{ManageExpenseChartActionBean.timeperiod ne 'YEARLY'}"/>
							<p:datePicker id="dayPicker"
								value="#{ManageExpenseChartActionBean.selectedDate}"
								style="width:200px; display:#{ManageExpenseChartActionBean.timeperiod eq 'DAILY' ? 'block':'none'}"
								view="month" showIcon="true" pattern="MM/yyyy">
								<p:ajax event="dateSelect"
									listener="#{ManageExpenseChartActionBean.updateChart}"
									update=":expenseChartForm:chartPanel" />
							</p:datePicker>

							<!-- pick year -->
							<p:selectOneMenu id="monthPicker"
								value="#{ManageExpenseChartActionBean.selectedYear}"
								style="width:200px;display:#{ManageExpenseChartActionBean.timeperiod eq 'MONTHLY' ? 'block':'none'}">
								<f:selectItems value="#{ManageExpenseChartActionBean.yearsList}" />
								<p:ajax listener="#{ManageExpenseChartActionBean.updateChart}"
									update=":expenseChartForm:chartPanel" />
							</p:selectOneMenu>
						</p:outputPanel>

						<br />
						<p:outputLabel id="selectedCategoryLabel"
							style="margin-top: 50px;"
							value="Category: #{ManageExpenseChartActionBean.selectedCategoryName}"></p:outputLabel>
						<hr />
						<!-- Chart -->
						<!-- <p:chart type="bar" id="chartPanel"
							model="#{ManageExpenseChartActionBean.expenseChart}"
							widgetVar="expenseChart"
							style="margin-top: 20px;width:100%;height: 100%;" /> -->
						<div style="overflow-x: auto; width: 100%;">
							<p:chart type="bar" id="chartPanel"
								model="#{ManageExpenseChartActionBean.expenseChart}"
								widgetVar="expenseChart"
								style="margin-top: 20px; width:100%; height: 400px;" />
						</div>
					</p:panelGrid>
				</p:panelGrid>
			</h:form>
		</p:panelGrid>
	</ui:define>

</ui:composition>
