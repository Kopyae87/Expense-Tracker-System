<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">
	<ui:define name="content">
		<h:form id="addExpenseForm" style="color: black;">
			<p:growl escape="false" globalOnly="true" life="5000"
				showDetail="true" />
			<p:panel id="addExpenseFormPanel"
				style="margin: 0 auto; width: 70%; border: 1px solid #ccc; border-radius: 8px; padding: 20px;">
				<h4 style="margin: 0px">Add Expense</h4>
				<p:panelGrid columns="2"
					columnClasses="ui-grid-col-6,ui-grid-col-6,"
					styleClass="ui-panelgrid-blank"
					style="width: 100%; text-align:left;">


					<!-- 		<h:outputLabel for="category" value="Category: " />
					<p:selectOneMenu id="category" style="width:80%;"
						value="#{ManageExpenseActionBean.selectedCategoryId}"
						required="true">
						<f:selectItem itemLabel="Select Category" itemValue=""
							noSelectionOption="true" />
						<f:selectItems value="#{ManageExpenseActionBean.categoryList}"
							var="cat" itemLabel="#{cat.name}" itemValue="#{cat.id}" />
					</p:selectOneMenu> -->

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-3,ui-grid-col-9"
						styleClass="ui-panelgrid-blank" style="width: 100%;">
						<h:outputLabel for="categoryPanelGroup" value="Category: " />
						<p:panelGrid styleClass="ui-panelgrid-blank"
							id="categoryPanelGroup">
							<div style="margin-top: -5px; margin-left: -5px;"
								id="categoryPanelGroup">
								<div class="ui-inputgroup ui-g-12 ui-lg-12 ui-lg-12">
									<p:commandButton styleClass="green-button" icon="fa fa-search"
										actionListener="#{ManageExpenseActionBean.selectCategory()}"
										id="selectCategoryDialogLink" process="@this">
										<p:ajax event="dialogReturn"
											listener="#{ManageExpenseActionBean.returnCategory}"
											update="categoryId" />
									</p:commandButton>
									<p:inputText id="categoryId"
										value="#{ManageExpenseActionBean.selectedCategoryId == null ? '' : ManageExpenseActionBean.category.name}"
										readonly="true" style="width: 40%" />
									<p:commandButton styleClass="red-button" icon="fa fa-times"
										action="#{ManageExpenseActionBean.clearSelectedCategory()}"
										process="@this" update="categoryId" />
								</div>
							</div>
						</p:panelGrid>
					</p:panelGrid>

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-3,ui-grid-col-9"
						styleClass="ui-panelgrid-blank" style="width: 100%;">
						<h:outputLabel for="expensedate" value="Expense Date: " />
						<p:datePicker id="expensedate" style="width: 60%"
							maxdate="#{ManageExpenseActionBean.maxDate}"
							value="#{ManageExpenseActionBean.currentExpense.expense_date}"
							pattern="dd-MM-yyyy" placeholder="dd-MM-yyyy" showIcon="true"></p:datePicker> 
					</p:panelGrid>

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-3,ui-grid-col-9"
						styleClass="ui-panelgrid-blank" style="width: 100%;">
						<h:outputLabel for="amount" value="Amount : " />
						<p:inputText
							value="#{ManageExpenseActionBean.currentExpense.amount}"
							style="width: 60%">
						</p:inputText>
					</p:panelGrid>

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-3,ui-grid-col-9"
						styleClass="ui-panelgrid-blank" style="width: 100%;">
						<h:outputLabel for="paymenttype" value="PaymentType: " />
						<p:selectOneMenu id="paymenttype" style="width: 60%"
							value="#{ManageExpenseActionBean.currentExpense.paymentType}"
							required="true">
							<f:selectItem itemLabel="Select Payment Method" itemValue=""
								noSelectionOption="true" />
							<f:selectItems value="#{ManageExpenseActionBean.paymenttypes}"
								var="p" itemLabel="#{p.label}" itemValue="#{p.label}" />
						</p:selectOneMenu>
					</p:panelGrid>

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-3,ui-grid-col-9"
						styleClass="ui-panelgrid-blank" style="width: 100%;">
						<h:outputLabel for="desc" value="Description : "
							style="vertical-align: top;" />
						<p:inputTextarea id="desc" style="width: 60%"
							value="#{ManageExpenseActionBean.currentExpense.description}"
							rows="5" cols="40" autoResize="true" maxlength="200" />
					</p:panelGrid>
					<!-- <h:outputText id="displayCounter" /> counter="displayCounter" counterTemplate="{0}characters."-->

				</p:panelGrid>
				<p:commandButton action="#{ManageExpenseActionBean.saveExpense}"
					value="Save" process="addExpenseForm:addExpenseFormPanel"
					update="addExpenseForm:addExpenseFormPanel :recentExpenseTableForm:recentExpenseTablePanel"
					rendered="#{!ManageExpenseActionBean.iseditMode}"></p:commandButton>
				<p:commandButton action="#{ManageExpenseActionBean.updateExpense}"
					value="update" process="addExpenseForm:addExpenseFormPanel"
					update="addExpenseForm:addExpenseFormPanel :recentExpenseTableForm:recentExpenseTablePanel"
					rendered="#{ManageExpenseActionBean.iseditMode}"></p:commandButton>
				<p:commandButton action="#{ManageExpenseActionBean.cancelExpense}"
					value="Cancel" process="@form"
					update="addExpenseForm:addExpenseFormPanel"></p:commandButton>
				<!--  -->
			</p:panel>
		</h:form>
		<h:form id="recentExpenseTableForm" style="margin-top: 20px;">
			<p:panel id="recentExpenseTablePanel">
				<p:dataTable id="recentExpenseTable"
					widgetVar="recentExpenseTableWidget" paginator="true"
					paginatorTemplate="{CurrentPageReport} {PreviousPageLink} {PageLinks} {NextPageLink} {RowsPerPageDropdown}"
					rowsPerPageTemplate="5,10,15" reflow="true" rowIndexVar="var"
					paginatorPosition="top"
					value="#{ManageExpenseActionBean.allExpenses}" var="expense"
					rowKey="#{expense.id}" border="4" style="width:100%;border: black;">

					<f:facet name="header">
						<h:panelGroup
							style="display:flex;justify-content:space-between;align-items:center;width:100%;">
							<h:outputText value="Recent Expenses"
								style="font-weight:bold; font-size:14px;" />
							<p:button value="Go to Enquiry" icon="fa fa-search"
								outcome="enquiryExpense" styleClass="ui-button-primary" />
						</h:panelGroup>
					</f:facet>

					<p:column headerText="Category">
						<h:outputText
							value="#{expense.category != null ? expense.category.name : 'N/A'}" />
					</p:column>

					<p:column headerText="Amount">
						<h:outputText value="#{expense.amount}" />
					</p:column>

					<p:column headerText="Description" width="25%">
						<h:outputText value="#{expense.description}" />
					</p:column>

					<p:column headerText="Expense date">
						<h:outputText value="#{expense.expense_date}">
							<f:convertDateTime pattern="dd-MM-yyyy" />
						</h:outputText>
					</p:column>

					<p:column headerText="Payment Type">
						<h:outputText value="#{expense.paymentType}" />
					</p:column>

					<p:column headerText="Actions">
						<p:commandButton value="Edit"
							action="#{ManageExpenseActionBean.openeditExpense(expense)}"
							process="@this" update=":addExpenseForm:addExpenseFormPanel"></p:commandButton>
						<!-- </p:column>
					<p:column> -->
						<p:commandButton value="Delete"
							action="#{ManageExpenseActionBean.deleteExpense(expense)}"
							update=":recentExpenseTableForm:recentExpenseTablePanel :addExpenseForm:addExpenseFormPanel"
							oncomplete="PF('recentExpenseTableWidget').clearFilters();"
							process="@this">
							<p:confirm header="Confirmation"
								message="Are you sure want to delete this expense?"
								icon="fa fa-exclamation-triangle" />
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:form>

		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="Yes" type="button"
				styleClass="ui-confirmdialog-yes" icon="fa fa-check" />
			<p:commandButton value="No" type="button"
				styleClass="ui-confirmdialog-no" icon="fa fa-times" />
		</p:confirmDialog>
	</ui:define>
</ui:composition>
