<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">
	<ui:define name="content">
		<h:form id="addExpenseBudgetForm" style="color: black;">
			<p:growl escape="false" globalOnly="true" life="5000"
				showDetail="true" />
			<p:panel id="addExpenseBudgetFormPanel"
				style="margin: 0 auto; width: 60%; border: 1px solid #ccc; border-radius: 8px; padding: 20px;">
				<h3 style="margin: 0px">Add Budget</h3>
				<p:panelGrid columns="2" columnClasses="ui-grid-col-6,ui-grid-col-6"
					styleClass="ui-panelgrid-blank"
					style="width: 100%; text-align:left;">

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-2,ui-grid-col-10"
						styleClass="ui-panelgrid-blank"
						style="width: 100%;">
						<h:outputLabel for="categoryPanelGroup" value="Category Type: " />
						<p:panelGrid styleClass="ui-panelgrid-blank"
							id="categoryPanelGroup">
							<div style="margin-top: -5px;"
								class="ui-g ui-fluid" id="categoryPanelGroup">
								<div class="ui-inputgroup ui-g-12 ui-lg-12 ui-lg-12">
									<p:commandButton styleClass="green-button" icon="fa fa-search"
										actionListener="#{ManageExpenseBudgetActionBean.selectCategory()}"
										id="selectCategoryDialogLink" process="@this">
										<p:ajax event="dialogReturn"
											listener="#{ManageExpenseBudgetActionBean.returnCategory}"
											update="categoryId" />
									</p:commandButton>
									<p:inputText id="categoryId"
										value="#{ManageExpenseBudgetActionBean.currentbudget.category.id == null ? '' : ManageExpenseBudgetActionBean.currentbudget.category.name}"
										readonly="true" />
									<p:commandButton styleClass="red-button" icon="fa fa-times"
										action="#{ManageExpenseBudgetActionBean.currentbudget.setCategory(null)}"
										process="@this" update="categoryId" />
								</div>
							</div>
						</p:panelGrid>
					</p:panelGrid>

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-2,ui-grid-col-10"
						styleClass="ui-panelgrid-blank"
						style="width: 100%;">
						<h:outputLabel for="period" value="Period:" />
						<p:selectOneMenu id="period" style="width:80%;"
							value="#{ManageExpenseBudgetActionBean.timevalue}"
							required="true">
							<f:selectItem itemLabel="Select Period" itemValue=""
								noSelectionOption="true" />
							<!-- <f:selectItem itemLabel="Daily" itemValue="daily" /> -->
							<f:selectItem itemLabel="Monthly" itemValue="monthly" />
							<f:selectItem itemLabel="Yearly" itemValue="yearly" />
							<f:selectItem itemLabel="Both" itemValue="both" />
							<p:ajax
								update=":addExpenseBudgetForm:budgetAmountWrapper :addExpenseBudgetForm:scopeWrapper"></p:ajax>
						</p:selectOneMenu>
					</p:panelGrid>

					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-3,ui-grid-col-9"
						styleClass="ui-panelgrid-blank"
						style="width: 100%;">
						<h:outputLabel for="desc" value="Description:" />
						<p:inputTextarea id="desc" style="width:95%;"
							value="#{ManageExpenseBudgetActionBean.currentbudget.description}"
							rows="5" cols="40" autoResize="true" maxlength="200" />
					</p:panelGrid>

					<p:panelGrid id="scopePanel" columns="2"
						columnClasses="ui-grid-col-3,ui-grid-col-9"
						styleClass="ui-panelgrid-blank "
						style="width: 100%;">
						<h:outputLabel for="scope" value="Time Scope:" />
						<p:panelGrid columns="2"
							columnClasses="ui-grid-col-6,ui-grid-col-6" style="width: 100%;">
							<p:selectOneMenu style="width:50%;"
								value="#{ManageExpenseBudgetActionBean.currentbudget.yearScope}">
								<f:selectItem itemLabel="Select Year" itemValue=""
									noSelectionOption="true" />
								<f:selectItems
									value="#{ManageExpenseBudgetActionBean.yearsScopeList}"
									var="scope" itemLabel="#{scope}" itemValue="#{scope}" />
								<p:ajax update=":addExpenseBudgetForm:budgetAmountWrapper"></p:ajax>
							</p:selectOneMenu>
							<p:outputPanel id="scopeWrapper">
								<p:outputPanel id="monthPanel" layout="block"
									rendered="#{ManageExpenseBudgetActionBean.timevalue == 'monthly' or ManageExpenseBudgetActionBean.timevalue == 'both'}">
									<p:selectOneMenu id="monthSelect"
										value="#{ManageExpenseBudgetActionBean.currentbudget.monthScope}">
										<f:selectItem itemLabel="Select Month" itemValue=""
											noSelectionOption="true" />
										<f:selectItems value="#{ManageExpenseBudgetActionBean.months}"
											var="scope" itemLabel="#{scope}" itemValue="#{scope.value}" />
										<p:ajax update=":addExpenseBudgetForm:budgetAmountWrapper"></p:ajax>
									</p:selectOneMenu>
								</p:outputPanel>
							</p:outputPanel>
						</p:panelGrid>
					</p:panelGrid>
				</p:panelGrid>
				<p:outputPanel id="budgetAmountWrapper">
					<p:panelGrid id="budgetAmountPanel" columnClasses="ui-grid-col-4,ui-grid-col-8" styleClass="ui-panelgrid-blank"
						style="width: 100%; text-align:left;">
						<hr />

						<p:panelGrid columns="2" columnClasses="ui-grid-col-6,ui-grid-col-6" styleClass="ui-panelgrid-blank"
							rendered="#{ManageExpenseBudgetActionBean.timevalue == 'yearly' or ManageExpenseBudgetActionBean.timevalue == 'both'}">
							<h:outputLabel value="Year Budget Amount: " />
							<p:inputText
								value="#{ManageExpenseBudgetActionBean.currentbudget.yearlyLimit}"
								style="width:100%;" />
						</p:panelGrid>

						<p:panelGrid columns="2" columnClasses="ui-grid-col-6,ui-grid-col-6" styleClass="ui-panelgrid-blank"
							rendered="#{ManageExpenseBudgetActionBean.timevalue == 'monthly' or ManageExpenseBudgetActionBean.timevalue == 'both'}">
							<h:outputLabel value="Monthly Budget Amount: " />
							<p:inputText
								value="#{ManageExpenseBudgetActionBean.currentbudget.monthlyLimit}"
								style="width:100%;" />
						</p:panelGrid>
					</p:panelGrid>
				</p:outputPanel>

				<p:commandButton
					action="#{ManageExpenseBudgetActionBean.saveBudget}" value="Save"
					process="@form"
					update="addExpenseBudgetForm:addExpenseBudgetFormPanel :budgetTableForm:budgetTablePanel"
					rendered="#{!ManageExpenseBudgetActionBean.iseditMode}">
				</p:commandButton>
				<p:commandButton
					action="#{ManageExpenseBudgetActionBean.updateBudget}"
					value="update"
					process="addExpenseBudgetForm:addExpenseBudgetFormPanel"
					update="addExpenseBudgetForm:addExpenseBudgetFormPanel"
					rendered="#{ManageExpenseBudgetActionBean.iseditMode}"></p:commandButton>
				<p:commandButton
					action="#{ManageExpenseBudgetActionBean.cancelBudget}"
					value="Cancel" process="@form"
					update="addExpenseBudgetForm:addExpenseBudgetFormPanel"></p:commandButton>
			</p:panel>

			<p:confirmDialog header="Confirm Overwrite"
				widgetVar="overwriteDialog" global="true" modal="true"
				showEffect="fade" hideEffect="fade"
				message="Budget for this category and period already exists. Do you want to overwrite?">
				<p:commandButton value="Yes" styleClass="ui-confirmdialog-yes"
					action="#{ManageExpenseBudgetActionBean.confirmOverwrite}"
					update="addExpenseBudgetFormPanel"
					oncomplete="PF('overwriteDialog').hide()" />
				<p:commandButton value="No" styleClass="ui-confirmdialog-no"
					action="#{ManageExpenseBudgetActionBean.cancelOverwrite}"
					immediate="true" oncomplete="PF('overwriteDialog').hide()" />
			</p:confirmDialog>
		</h:form>
		<h:form id="budgetTableForm" style="margin-top: 20px;">
			<p:panel id="budgetTablePanel">
				<p:dataTable id="budgetTable" widgetVar="recentExpenseTableWidget"
					paginator="true"
					paginatorTemplate="{CurrentPageReport} {PreviousPageLink} {PageLinks} {NextPageLink} {RowsPerPageDropdown}"
					rowsPerPageTemplate="5,10,15" reflow="true" rowIndexVar="var"
					rows="5" paginatorPosition="top"
					value="#{ManageExpenseBudgetActionBean.budgetsList}" var="b"
					rowKey="#{expense.id}" border="4" style="width:100%;border: black;">

					<p:column headerText="Category">
						<h:outputText
							value="#{b.category != null ? b.category.name : 'N/A'}" />
					</p:column>

					<p:column headerText="Budget Year date">
						<h:outputText value="#{b.yearScope}">
						</h:outputText>
					</p:column>

					<p:column headerText="Month">
						<h:outputText
							value="#{b.monthScope != null ? b.monthScope : '-'}" />
					</p:column>
					
					<p:column headerText="Yearly Budget">
						<h:outputText
							value="#{b.yearlyLimit != null ? b.yearlyLimit : '-'}" />
					</p:column>

					<p:column headerText="Monthly Budget">
						<h:outputText
							value="#{b.monthlyLimit != null ? b.monthlyLimit : '-'}" />
					</p:column>

					<p:column headerText="Description" width="25%">
						<h:outputText value="#{b.description}" />
					</p:column>

					<p:column headerText="Actions">
						<p:commandButton value="Edit"
							action="#{ManageExpenseBudgetActionBean.openEditBudget(b)}"
							process="@this"
							update="addExpenseBudgetForm:addExpenseBudgetFormPanel"></p:commandButton>
						<!-- </p:column>
					<p:column> -->
						<p:commandButton value="Delete"
							action="#{ManageExpenseBudgetActionBean.deleteBudget(b)}"
							update=":budgetTableForm:budgetTablePanel addExpenseBudgetForm:addExpenseBudgetFormPanel"
							oncomplete="PF('recentExpenseTableWidget').clearFilters();"
							process="@this">
							<!-- <p:confirm header="Confirmation"
								message="Are you sure want to delete this expense?"
								icon="fa fa-exclamation-triangle" /> -->
						</p:commandButton>
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:form>


	</ui:define>

</ui:composition>
