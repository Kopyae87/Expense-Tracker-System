<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/common/commonLayout.xhtml">
	<ui:define name="content">
		<h:form id="budgetAddForm">
			<p:growl escape="false" globalOnly="true" life="5000"
				showDetail="true" id="growl" />
			<p:tabView id="budgetTabView">
				<!-- Budget -->

				<p:tab title="Category Budgets">
					<p:outputPanel id="categoryBudgetWrapper" layout="block">
						<p:panel id="categoryBudgetFormPanel"
							style="margin: 20px auto;
                width: 60%;       
                border: 1px solid #ccc; 
                border-radius: 8px;    
                padding: 20px;     
                box-shadow: 0 2px 6px rgba(0,0,0,0.1);
                background-color: #fff;">
							<p:outputPanel id="categoryFormWrapper">
								<!-- add/edit category Budget form-->
								<p:panelGrid columns="2"
									columnClasses="ui-grid-col-6,ui-grid-col-6"
									styleClass="ui-panelgrid-blank"
									style="width: 100%; text-align:left;border: 10px">
									<p:panelGrid columns="2"
										columnClasses="ui-grid-col-4,ui-grid-col-8"
										styleClass="ui-panelgrid-blank" style="width: 100%;">
										<h:outputLabel for="categoryPanelGroup"
											value="Category Type: " styleClass="input-label mandatory" />
										<p:panelGrid styleClass="ui-panelgrid-blank"
											id="categoryPanelGroup">
											<div style="margin-top: -5px;" class="ui-g ui-fluid"
												id="categoryPanelGroup">
												<div class="ui-inputgroup ui-g-12 ui-lg-12 ui-lg-12">
													<p:commandButton styleClass="green-button"
														icon="fa fa-search"
														actionListener="#{ManageExpenseBudgetActionBean.selectCategory()}"
														id="selectCategoryDialogLink" process="@this">
														<p:ajax event="dialogReturn"
															listener="#{ManageExpenseBudgetActionBean.returnCategory}"
															update="categoryId" />
													</p:commandButton>
													<p:inputText id="categoryId"
														value="#{ManageExpenseBudgetActionBean.currentbudget.category.id == null ? '' : ManageExpenseBudgetActionBean.currentbudget.category.name}"
														readonly="true" />
													<p:commandButton styleClass="red-button" icon="fa fa-times"
														action="#{ManageExpenseBudgetActionBean.currentbudget.setCategory(null)}"
														process="@this" update="categoryId" />
												</div>
											</div>
										</p:panelGrid>
									</p:panelGrid>

									<p:panelGrid columns="2"
										columnClasses="ui-grid-col-4,ui-grid-col-8"
										styleClass="ui-panelgrid-blank" style="width: 100%;">
										<h:outputLabel for="period" value="Period:"
											styleClass="input-label mandatory" />
										<p:selectOneMenu id="period" style="width:80%;"
											value="#{ManageExpenseBudgetActionBean.timevalue}">
											<f:selectItem itemLabel="Select Period" itemValue=""
												noSelectionOption="true" />
											<f:selectItem itemLabel="Monthly" itemValue="monthly" />
											<f:selectItem itemLabel="Yearly" itemValue="yearly" />
											<!-- <f:selectItem itemLabel="Both" itemValue="both" /> -->
											<p:ajax process="@this" update="scopePanel amountsPanel"></p:ajax>
										</p:selectOneMenu>
									</p:panelGrid>

									<p:panelGrid columns="2"
										columnClasses="ui-grid-col-4,ui-grid-col-8"
										styleClass="ui-panelgrid-blank" style="width: 100%;">
										<h:outputLabel for="desc" value="Description:" />
										<p:inputTextarea id="desc" style="width:95%;"
											value="#{ManageExpenseBudgetActionBean.currentbudget.description}"
											rows="5" cols="40" autoResize="true" maxlength="200" />
									</p:panelGrid>

									<p:panelGrid id="scopePanel" columns="2"
										columnClasses="ui-grid-col-4,ui-grid-col-8"
										styleClass="ui-panelgrid-blank " style="width: 100%;">
										<h:outputLabel for="scope" value="Time Scope:"
											styleClass="input-label mandatory" />
										<p:panelGrid columns="2"
											columnClasses="ui-grid-col-6,ui-grid-col-6"
											style="width: 100%;">
											<p:selectOneMenu style="width:80%;"
												value="#{ManageExpenseBudgetActionBean.currentbudget.yearScope}">
												<f:selectItem itemLabel="Select Year" itemValue=""
													noSelectionOption="true" />
												<f:selectItems
													value="#{ManageExpenseBudgetActionBean.yearsScopeList}"
													var="scope" itemLabel="#{scope}" itemValue="#{scope}" />
												<p:ajax process="@this" update="amountsPanel"></p:ajax>
											</p:selectOneMenu>
											<p:outputPanel id="scopeWrapper">
												<p:outputPanel id="monthPanel" layout="block"
													rendered="#{ManageExpenseBudgetActionBean.timevalue == 'monthly' or ManageExpenseBudgetActionBean.timevalue == 'both'}">
													<p:selectOneMenu id="monthSelect"
														value="#{ManageExpenseBudgetActionBean.currentbudget.monthScope}">
														<f:selectItem itemLabel="Select Month" itemValue=""
															noSelectionOption="true" />
														<f:selectItems
															value="#{ManageExpenseBudgetActionBean.months}"
															var="scope" itemLabel="#{scope}"
															itemValue="#{scope.value}" />
														<p:ajax process="@this" update="amountsPanel"></p:ajax>
													</p:selectOneMenu>
												</p:outputPanel>
											</p:outputPanel>
										</p:panelGrid>
									</p:panelGrid>

									<!-- Budgets -->
								</p:panelGrid>
								<p:panelGrid id="amountsPanel" columns="1"
									style="width:50%; margin-top:10px;"
									styleClass="ui-panelgrid-blank">
									<p:panelGrid columns="2" style="width:100%;"
										rendered="#{ManageExpenseBudgetActionBean.timevalue == 'yearly'}">
										<p:outputLabel value="Yearly Budget:" styleClass="input-label mandatory"/>
										<p:inputText 
											value="#{ManageExpenseBudgetActionBean.currentbudget.yearlyLimit}"
											 />
									</p:panelGrid>

									<p:panelGrid columns="2" style="width:100%;"
										rendered="#{ManageExpenseBudgetActionBean.timevalue == 'monthly' }">
										<p:outputLabel value="Monthly Budget: "  styleClass="input-label mandatory"/>
										<p:inputText
											value="#{ManageExpenseBudgetActionBean.currentbudget.monthlyLimit}"
											/>

									</p:panelGrid>

								</p:panelGrid>


								<h:panelGroup style="text-align:center; margin-top:15px;">
									<p:commandButton
										action="#{ManageExpenseBudgetActionBean.saveBudget}"
										value="Save" process="@form"
										update="categoryFormWrapper categoryTablePanel :budgetAddForm:growl"
										rendered="#{!ManageExpenseBudgetActionBean.iseditMode}">
									</p:commandButton>

									<p:commandButton
										action="#{ManageExpenseBudgetActionBean.updateBudget}"
										value="Update" process="@form"
										update="categoryFormWrapper categoryTablePanel :budgetAddForm:growl"
										rendered="#{ManageExpenseBudgetActionBean.iseditMode}" />

									<p:commandButton
										action="#{ManageExpenseBudgetActionBean.cancelBudget}"
										value="Cancel" process="@form" update="categoryFormWrapper" />
								</h:panelGroup>
							</p:outputPanel>
						</p:panel>
					</p:outputPanel>
					<!-- Category Budget Table -->
					<p:outputPanel id="categoryBudgetTableWrapper">
						<p:panel id="categoryTablePanel" style="margin-top: 20px;">
							<p:dataTable
								value="#{ManageExpenseBudgetActionBean.categoryBudgetsList}"
								var="b" paginator="true" rows="5"
								widgetVar="categoryBudgetWidget"
								style="width:100%;border: black;" border="1">
								<p:column headerText="Category">
									<h:outputText
										value="#{b.category != null ? b.category.name : 'N/A'}" />
								</p:column>
								<p:column headerText="Year">
									<h:outputText value="#{b.yearScope}" />
								</p:column>
								<p:column headerText="Month">
									<h:outputText
										value="#{b.monthScope != null ? b.monthScope : '-'}" />
								</p:column>
								<p:column headerText="Yearly Budget (MMK)">
									<h:outputText value="#{b.yearlyLimit != null ? b.yearlyLimit : '-'}" />
								</p:column>
								<p:column headerText="Monthly Budget (MMK)">
									<h:outputText value="#{b.monthlyLimit != null ? b.monthlyLimit : '-'}" />
								</p:column>
								<p:column headerText="Desc">
									<h:outputText value="#{b.description}" />
								</p:column>
								<p:column headerText="Actions">
									<p:commandButton value="Edit"
										action="#{ManageExpenseBudgetActionBean.openEditBudget(b)}"
										process=":budgetAddForm:budgetTabView:categoryBudgetTableWrapper"
										update=":budgetAddForm:budgetTabView:categoryBudgetWrapper" />
									<p:commandButton value="Delete"
										action="#{ManageExpenseBudgetActionBean.deleteBudget(b)}"
										update=":budgetAddForm:budgetTabView:categoryBudgetWrapper :budgetAddForm:budgetTabView:categoryTablePanel :budgetAddForm:growl"
										process="@this"
										oncomplete="PF('categoryBudgetWidget').clearFilters();" />
								</p:column>

							</p:dataTable>
						</p:panel>
					</p:outputPanel>
					<p:confirmDialog header="Confirm Overwrite"
						widgetVar="overwriteDlg" modal="true" showEffect="fade"
						hideEffect="fade"
						message="Budget for this category and period already exists. Do you want to overwrite?">
						<p:commandButton value="Yes" styleClass="ui-confirmdialog-yes"
							action="#{ManageExpenseBudgetActionBean.confirmOverwrite}"
							update=":budgetAddForm:budgetTabView:categoryBudgetWrapper"
							oncomplete="PF('overwriteDialog').hide()" />
						<p:commandButton value="No" styleClass="ui-confirmdialog-no"
							action="#{ManageExpenseBudgetActionBean.cancelOverwrite}"
							immediate="true" oncomplete="PF('overwriteDialog').hide()" />
					</p:confirmDialog>
					<!-- <p:dialog id="overwriteDlg" widgetVar="overwriteDlg"
						header="Confirm Overwrite" modal="true" closable="false"
						resizable="false" draggable="false" showEffect="fade"
						hideEffect="fade" style="width:400px;">

						<h:panelGrid columns="1" style="text-align:center;width:100%;">
							<h:outputText
								value="Budget for this category and period already exists." />
							<h:outputText value="Do you want to overwrite?"
								style="font-weight:bold;margin-top:10px;" />
						</h:panelGrid>

						<h:panelGrid columns="2"
							style="margin-top:15px;text-align:center;width:100%;">
							<p:commandButton value="Yes"
								action="#{ManageExpenseBudgetActionBean.confirmOverwrite}"
								update=":budgetAddForm:budgetTabView:categoryFormWrapper 
                    :budgetAddForm:budgetTabView:categoryTablePanel"
								process="@this" ajax="false" styleClass="ui-button-success"
								oncomplete="PF('overwriteDlg').hide()" />

							<p:commandButton value="No"
								action="#{ManageExpenseBudgetActionBean.cancelOverwrite}"
								immediate="true" process="@this" ajax="false"
								styleClass="ui-button-secondary"
								oncomplete="PF('overwriteDlg').hide()" />
						</h:panelGrid>
					</p:dialog> -->
				</p:tab>

				<!-- global budget -->

				<p:tab title="Global Budgets">
					<p:outputPanel id="globalFormPanelWrapper" layout="block">
						<p:panel id="globalFormPanel"
							style="margin: 20px auto;width: 60%;border: 1px solid #ccc; border-radius: 8px;padding: 20px;box-shadow: 0 2px 6px rgba(0,0,0,0.1);background-color: #fff;">
							<!-- style="margin: 0 auto; width: 80%; border: none;"> -->
							<p:outputPanel id="globalFormWrapper">
								<p:panelGrid columns="1" style="width: 100%; text-align: left;"
									styleClass="ui-panelgrid-blank">
									<!-- Similar fields but for globalBudget -->
									<p:panelGrid columns="2" style="width: 40%;"
										styleClass="ui-panelgrid-blank"
										columnClasses="ui-panelgrid-col-5,ui-panelgrid-col-7">
										<h:outputLabel value="Period:"
											styleClass="input-label mandatory" />
										<p:selectOneMenu
											value="#{ManageExpenseBudgetActionBean.globalTimeValue}"
											style="width: 120px;margin-left: 70px;">
											<f:selectItem itemLabel="Select Period" itemValue=""
												noSelectionOption="true" />
											<f:selectItem itemLabel="Monthly" itemValue="monthly" />
											<f:selectItem itemLabel="Yearly" itemValue="yearly" />
											<!-- <f:selectItem itemLabel="Both" itemValue="both" /> -->
											<p:ajax update="globalFormWrapper" />
										</p:selectOneMenu>
									</p:panelGrid>

									<p:panelGrid columns="2"
										columnClasses="ui-panelgrid-col-5,ui-panelgrid-col-7"
										style="width:40%;margin-bottom: 4px;"
										styleClass="ui-panelgrid-blank">
										<h:outputLabel value="Year:"
											styleClass="input-label mandatory" />
										<p:selectOneMenu style="width: 120px;margin-left: 80px;"
											value="#{ManageExpenseBudgetActionBean.globalBudget.yearScope}">
											<f:selectItem itemLabel="Select Year" itemValue="#{null}"
												noSelectionOption="true" />
											<f:selectItems
												value="#{ManageExpenseBudgetActionBean.yearsScopeList}"
												var="y" itemLabel="#{y}" itemValue="#{y}" />
										</p:selectOneMenu>
									</p:panelGrid>

									<p:panelGrid columns="2"
										columnClasses="ui-panelgrid-col-5,ui-panelgrid-col-7"
										style="width:40%;margin-bottom:4px;"
										rendered="#{ManageExpenseBudgetActionBean.globalTimeValue == 'monthly' or ManageExpenseBudgetActionBean.globalTimeValue == 'both'}">
										<h:outputLabel value="Month :"
											styleClass="input-label mandatory" />
										<p:selectOneMenu style="width: 122px;margin-left: 65px;"
											value="#{ManageExpenseBudgetActionBean.globalBudget.monthScope}">
											<f:selectItem itemLabel="Select Month" itemValue="#{null}"
												noSelectionOption="true" />
											<f:selectItems
												value="#{ManageExpenseBudgetActionBean.months}" var="m"
												itemLabel="#{m}" itemValue="#{m.value}" />
										</p:selectOneMenu>
									</p:panelGrid>

									<p:panelGrid columns="2"
										columnClasses="ui-panelgrid-col-5,ui-panelgrid-col-7"
										style="width:40%;" styleClass="ui-panelgrid-blank">
										<p:outputLabel value="Yearly Budget:"
											styleClass="input-label mandatory"
											rendered="#{ManageExpenseBudgetActionBean.globalTimeValue == 'yearly' or ManageExpenseBudgetActionBean.globalTimeValue == 'both'}" />
										<p:inputNumber
											value="#{ManageExpenseBudgetActionBean.globalBudget.yearlyLimit}" maxValue="1000000000" required="true" mode="decimal"
											decimalPlaces="0"
											rendered="#{ManageExpenseBudgetActionBean.globalTimeValue == 'yearly' or ManageExpenseBudgetActionBean.globalTimeValue == 'both'}" />

										<p:outputLabel value="Monthly Budget:"
											styleClass="input-label mandatory"
											rendered="#{ManageExpenseBudgetActionBean.globalTimeValue == 'monthly' or ManageExpenseBudgetActionBean.globalTimeValue == 'both'}" />
										<p:inputNumber 
											value="#{ManageExpenseBudgetActionBean.globalBudget.monthlyLimit}" maxValue="1000000000" required="true" mode="decimal"
											decimalPlaces="0"
											rendered="#{ManageExpenseBudgetActionBean.globalTimeValue == 'monthly' or ManageExpenseBudgetActionBean.globalTimeValue == 'both'}" />
									</p:panelGrid>

									<!-- buttons -->
									<h:panelGroup style="text-align:center; margin-top:15px;">
										<p:commandButton
											action="#{ManageExpenseBudgetActionBean.saveGlobalBudget}"
											value="Save" process="globalFormPanel"
											update=":budgetAddForm:budgetTabView:globalFormPanelWrapper :budgetAddForm:budgetTabView:globalTableWrapper :budgetAddForm:growl"
											rendered="#{!ManageExpenseBudgetActionBean.globalEditMode}"
											oncomplete="PF('globalBudgetWidget').clearFilters();" />

										<p:commandButton
											action="#{ManageExpenseBudgetActionBean.updateGlobalBudget}"
											value="Update" process="globalFormPanel"
											update=":budgetAddForm:budgetTabView:globalFormPanelWrapper :budgetAddForm:budgetTabView:globalTableWrapper :budgetAddForm:growl"
											rendered="#{ManageExpenseBudgetActionBean.globalEditMode}"
											oncomplete="PF('globalBudgetWidget').clearFilters();" />

										<p:commandButton
											action="#{ManageExpenseBudgetActionBean.cancelGlobalBudget}"
											value="Cancel" process="globalFormPanel"
											update=":budgetAddForm:budgetTabView:globalFormPanelWrapper" />
									</h:panelGroup>

								</p:panelGrid>
							</p:outputPanel>
						</p:panel>
					</p:outputPanel>

					<!-- Global Budget Table -->
					<p:outputPanel id="globalTableWrapper">
						<p:panel id="globalTablePanel" style="margin-top:20px;">
							<p:dataTable
								value="#{ManageExpenseBudgetActionBean.globalBudgetsList}"
								var="g" paginator="true" rows="5" widgetVar="globalBudgetWidget"
								style="width:100%;border: black;" border="1" rowIndexVar="index">

								<p:column headerText="No">
									<h:outputText value="#{index + 1}" />
								</p:column>

								<p:column headerText="Year">
									<h:outputText value="#{g.yearScope}" />
								</p:column>
								<p:column headerText="Month">
									<h:outputText
										value="#{g.monthScope != null ? g.monthScope : '-'}" />
								</p:column>
								<p:column headerText="Yearly Limit">
									<h:outputText
										value="#{g.yearlyLimit != null ? g.yearlyLimit : '-'}" />
								</p:column>
								<p:column headerText="Monthly Limit">
									<h:outputText
										value="#{g.monthlyLimit != null ? g.monthlyLimit : '-'}" />
								</p:column>
								<p:column headerText="Actions">
									<p:commandButton value="Edit"
										action="#{ManageExpenseBudgetActionBean.openEditGlobalBudget(g)}"
										update=":budgetAddForm:budgetTabView:globalFormPanelWrapper"
										process=":budgetAddForm:budgetTabView:globalTableWrapper" />

									<p:commandButton value="Delete"
										action="#{ManageExpenseBudgetActionBean.deleteGlobalBudget(g)}"
										update=":budgetAddForm:budgetTabView:globalTableWrapper :budgetAddForm:budgetTabView:globalFormPanelWrapper :budgetAddForm:growl"
										process="@this"
										oncomplete="PF('globalBudgetWidget').clearFilters();">
									</p:commandButton>
								</p:column>

							</p:dataTable>
						</p:panel>
					</p:outputPanel>
				</p:tab>
			</p:tabView>
		</h:form>
	</ui:define>
</ui:composition>
